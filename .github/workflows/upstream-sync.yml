
name: Upstream Sync and Release Mirror

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */6 * * *"

  push:
    branches:
      - main
    paths:
      - ".github/workflows/upstream-sync.yml"

permissions:
  contents: write

concurrency:
  group: totk-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Branches, Tags and All Releases
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout mirror
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync main, dev and tags
        shell: bash
        run: |
          set -euo pipefail

          UPSTREAM="https://github.com/valentderah/totk-pc-recomp.git"

          git remote add upstream "$UPSTREAM"

          git fetch origin --prune
          git fetch upstream --prune --tags

          # Sync main while preserving this mirror workflow.
          git switch main
          git merge --no-edit upstream/main
          git push origin main

          # Keep dev exactly aligned with upstream.
          git push --force origin \
            refs/remotes/upstream/dev:refs/heads/dev

          # Mirror all upstream tags.
          git push origin --tags

      - name: Mirror all stable and pre-releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          REPO="$GITHUB_REPOSITORY"
          UPSTREAM="valentderah/totk-pc-recomp"

          echo "Fetching all upstream releases..."

          gh api --paginate \
            "repos/$UPSTREAM/releases?per_page=100" \
            | jq -s 'add' > upstream-releases.json

          mapfile -t releases < <(
            jq -c '.[] | select(.draft == false)' upstream-releases.json
          )

          echo "Found ${#releases[@]} published releases."

          if ((${#releases[@]} == 0)); then
            echo "No published releases found."
            exit 0
          fi

          for release_json in "${releases[@]}"; do

            TAG=$(jq -r '.tag_name' <<< "$release_json")
            TITLE=$(jq -r '.name // .tag_name' <<< "$release_json")
            PRERELEASE=$(jq -r '.prerelease' <<< "$release_json")

            jq -r '.body // ""' <<< "$release_json" > release-notes.md

            echo "======================================"
            echo "Mirroring: $TAG"
            echo "Pre-release: $PRERELEASE"
            echo "======================================"

            rm -rf dist
            mkdir -p dist

            mapfile -t upstream_assets < <(
              jq -c '.assets[]?' <<< "$release_json"
            )

            for asset_json in "${upstream_assets[@]}"; do

              NAME=$(jq -r '.name' <<< "$asset_json")
              URL=$(jq -r '.browser_download_url' <<< "$asset_json")
              DIGEST=$(jq -r '.digest // ""' <<< "$asset_json")

              FILENAME=$(basename -- "$NAME")
              FILEPATH="dist/$FILENAME"

              echo "Downloading: $FILENAME"

              curl --fail --show-error --location \
                --retry 3 --retry-all-errors \
                "$URL" -o "$FILEPATH"

              test -s "$FILEPATH"

              EXPECTED="${DIGEST#sha256:}"

              # Official checksum for the original v0.1.1 installer.
              if [[ -z "$EXPECTED" && "$NAME" == "TotK-Setup-0.1.1-windows.zip" ]]; then
                EXPECTED="194f8191e8cef2cde3b608214113757a4ee5ed3f77278f44690435f763c64f7b"
              fi

              if [[ -n "$EXPECTED" ]]; then
                ACTUAL=$(sha256sum "$FILEPATH" | cut -d' ' -f1)

                if [[ "$ACTUAL" != "$EXPECTED" ]]; then
                  echo "ERROR: SHA256 mismatch for $FILENAME"
                  exit 1
                fi

                echo "SHA256 verified: $FILENAME"
              else
                echo "No official upstream SHA256 metadata for $FILENAME"
              fi

            done

            # Generate our own checksum manifest.
            (
              cd dist
              shopt -s nullglob
              files=(*)

              if ((${#files[@]})); then
                sha256sum -- "${files[@]}" > SHA256SUMS.txt
              fi
            )

            # Check whether the release already exists.
            if RELEASE_ID=$(gh api \
              "repos/$REPO/releases/tags/$TAG" \
              --jq '.id' 2>/dev/null); then

              echo "Updating existing release: $TAG"

              jq -n \
                --arg name "$TITLE" \
                --rawfile body release-notes.md \
                --argjson prerelease "$PRERELEASE" \
                '{
                  name: $name,
                  body: $body,
                  prerelease: $prerelease
                }' > release-update.json

              gh api --method PATCH \
                "repos/$REPO/releases/$RELEASE_ID" \
                --input release-update.json

            else

              echo "Creating new release: $TAG"

              if [[ "$PRERELEASE" == "true" ]]; then
                gh release create "$TAG" \
                  --repo "$REPO" \
                  --title "$TITLE" \
                  --notes-file release-notes.md \
                  --prerelease \
                  --verify-tag
              else
                gh release create "$TAG" \
                  --repo "$REPO" \
                  --title "$TITLE" \
                  --notes-file release-notes.md \
                  --verify-tag
              fi

            fi

            # Upload or replace all release assets.
            shopt -s nullglob
            assets=(dist/*)

            if ((${#assets[@]})); then
              gh release upload "$TAG" "${assets[@]}" \
                --repo "$REPO" \
                --clobber
            fi

            echo "Release successfully mirrored: $TAG"

            gh release view "$TAG" --repo "$REPO"

          done

          echo "All upstream releases mirrored successfully."
