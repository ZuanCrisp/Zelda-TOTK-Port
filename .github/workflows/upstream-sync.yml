
name: Upstream Sync and Release Mirror

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */6 * * *"

  push:
    branches:
      - main
    paths:
      - ".github/workflows/upstream-sync.yml"

permissions:
  contents: write

concurrency:
  group: totk-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Branches, Tags and All Releases
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout mirror
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install git-filter-repo
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/git-filter-repo-venv"
          "$RUNNER_TEMP/git-filter-repo-venv/bin/python" -m pip install --disable-pip-version-check --quiet git-filter-repo==2.47.0
          echo "$RUNNER_TEMP/git-filter-repo-venv/bin" >> "$GITHUB_PATH"

      - name: Sync main, dev and tags
        shell: bash
        env:
          LEGACY_GIT_EMAIL: ${{ vars.LEGACY_GIT_EMAIL }}
        run: |
          set -euo pipefail
          UPSTREAM_URL="https://github.com/valentderah/totk-pc-recomp.git"
          ORIGIN_URL="$(git remote get-url origin)"
          git remote add upstream "$UPSTREAM_URL" 2>/dev/null || git remote set-url upstream "$UPSTREAM_URL"

          git fetch origin --prune
          git fetch upstream --prune --force \
            "+refs/heads/*:refs/remotes/upstream/*"
          # Do not prune tags; preserve the existing mirror's stale-tag policy.
          git fetch upstream --force "+refs/tags/*:refs/tags/*"

          : "${LEGACY_GIT_EMAIL:?Set the LEGACY_GIT_EMAIL Actions variable before running this workflow}"
          MAILMAP="$RUNNER_TEMP/git-mailmap"
          printf '<%s> <%s>\n' '165035502+ZuanCrisp@users.noreply.github.com' "$LEGACY_GIT_EMAIL" > "$MAILMAP"
          mapfile -t SANITIZE_REFS < <(
            {
              git for-each-ref --format='%(refname)' refs/remotes/upstream/
              git for-each-ref --format='%(refname)' refs/tags/
            } | sort -u
          )
          if ((${#SANITIZE_REFS[@]} == 0)); then
            echo "::error::No upstream refs or tags were fetched for sanitization."
            exit 1
          fi
          git filter-repo --force --mailmap "$MAILMAP" --refs "${SANITIZE_REFS[@]}"

          # Partial filtering should retain remotes; reassert their URLs defensively.
          git remote add origin "$ORIGIN_URL" 2>/dev/null || git remote set-url origin "$ORIGIN_URL"
          git remote add upstream "$UPSTREAM_URL" 2>/dev/null || git remote set-url upstream "$UPSTREAM_URL"
          git fetch origin --prune

          # Refuse to publish if the old address survived in fetched refs.
          if git log --format='%ae%n%ce' "${SANITIZE_REFS[@]}" | grep -Fqi -- "$LEGACY_GIT_EMAIL"; then
            echo "::error::Legacy email remains in fetched source history after sanitization."
            exit 1
          fi
          if git for-each-ref --format='%(taggeremail)' refs/tags/ | grep -Fqi -- "$LEGACY_GIT_EMAIL"; then
            echo "::error::Legacy email remains in an annotated tag after sanitization."
            exit 1
          fi

          git switch main
          git merge --no-edit refs/remotes/upstream/main
          git push origin main

          # Preserve the existing behavior: dev follows upstream exactly.
          git push --force origin \
            refs/remotes/upstream/dev:refs/heads/dev

          # Tags are sanitized before being mirrored.
          git push origin --tags
          echo "Sanitized main, dev and tags synchronized."
      - name: Mirror all stable and pre-releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          REPO="$GITHUB_REPOSITORY"
          UPSTREAM="valentderah/totk-pc-recomp"

          echo "Fetching all upstream releases..."

          gh api --paginate \
            "repos/$UPSTREAM/releases?per_page=100" \
            | jq -s 'add' > upstream-releases.json

          mapfile -t releases < <(
            jq -c '.[] | select(.draft == false)' upstream-releases.json
          )

          echo "Found ${#releases[@]} published releases."

          if ((${#releases[@]} == 0)); then
            echo "No published releases found."
            exit 0
          fi

          for release_json in "${releases[@]}"; do

            TAG=$(jq -r '.tag_name' <<< "$release_json")
            TITLE=$(jq -r '.name // .tag_name' <<< "$release_json")
            PRERELEASE=$(jq -r '.prerelease' <<< "$release_json")

            jq -r '.body // ""' <<< "$release_json" > release-notes.md

            echo "======================================"
            echo "Mirroring: $TAG"
            echo "Pre-release: $PRERELEASE"
            echo "======================================"

            rm -rf dist
            mkdir -p dist

            mapfile -t upstream_assets < <(
              jq -c '.assets[]?' <<< "$release_json"
            )

            for asset_json in "${upstream_assets[@]}"; do

              NAME=$(jq -r '.name' <<< "$asset_json")
              URL=$(jq -r '.browser_download_url' <<< "$asset_json")
              DIGEST=$(jq -r '.digest // ""' <<< "$asset_json")

              FILENAME=$(basename -- "$NAME")
              FILEPATH="dist/$FILENAME"

              echo "Downloading: $FILENAME"

              curl --fail --show-error --location \
                --retry 3 --retry-all-errors \
                "$URL" -o "$FILEPATH"

              test -s "$FILEPATH"

              EXPECTED="${DIGEST#sha256:}"

              # Official checksum for the original v0.1.1 installer.
              if [[ -z "$EXPECTED" && "$NAME" == "TotK-Setup-0.1.1-windows.zip" ]]; then
                EXPECTED="194f8191e8cef2cde3b608214113757a4ee5ed3f77278f44690435f763c64f7b"
              fi

              if [[ -n "$EXPECTED" ]]; then
                ACTUAL=$(sha256sum "$FILEPATH" | cut -d' ' -f1)

                if [[ "$ACTUAL" != "$EXPECTED" ]]; then
                  echo "ERROR: SHA256 mismatch for $FILENAME"
                  exit 1
                fi

                echo "SHA256 verified: $FILENAME"
              else
                echo "No official upstream SHA256 metadata for $FILENAME"
              fi

            done

            # Generate our own checksum manifest.
            (
              cd dist
              shopt -s nullglob
              files=(*)

              if ((${#files[@]})); then
                sha256sum -- "${files[@]}" > SHA256SUMS.txt
              fi
            )

            # Check whether the release already exists.
            if RELEASE_ID=$(gh api \
              "repos/$REPO/releases/tags/$TAG" \
              --jq '.id' 2>/dev/null); then

              echo "Updating existing release: $TAG"

              jq -n \
                --arg name "$TITLE" \
                --rawfile body release-notes.md \
                --argjson prerelease "$PRERELEASE" \
                '{
                  name: $name,
                  body: $body,
                  prerelease: $prerelease
                }' > release-update.json

              gh api --method PATCH \
                "repos/$REPO/releases/$RELEASE_ID" \
                --input release-update.json

            else

              echo "Creating new release: $TAG"

              if [[ "$PRERELEASE" == "true" ]]; then
                gh release create "$TAG" \
                  --repo "$REPO" \
                  --title "$TITLE" \
                  --notes-file release-notes.md \
                  --prerelease \
                  --verify-tag
              else
                gh release create "$TAG" \
                  --repo "$REPO" \
                  --title "$TITLE" \
                  --notes-file release-notes.md \
                  --verify-tag
              fi

            fi

            # Upload or replace all release assets.
            shopt -s nullglob
            assets=(dist/*)

            if ((${#assets[@]})); then
              gh release upload "$TAG" "${assets[@]}" \
                --repo "$REPO" \
                --clobber
            fi

            echo "Release successfully mirrored: $TAG"

            gh release view "$TAG" --repo "$REPO"

          done

          echo "All upstream releases mirrored successfully."
